<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Oficina Sin Tokens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --bg2:#0c1016; --linea:#1b222c; --linea2:#28313d; --texto:#e9eef5; --suave:#8792a2; --tenue:#4c5664;
  --verde:#3ddc84; --ambar:#f5c451; --rojo:#ff5d6c; --azul:#7cc4ff; --gris:#5b6574;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--texto)}
body{font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 70% -10%,#10241a55,transparent 60%),var(--bg)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
main{max-width:1160px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.marca{display:flex;flex-direction:column;gap:6px}
.marca small{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--suave)}
h1{margin:0;font-weight:500;font-size:28px;letter-spacing:-.02em}
h1 i{font-style:normal;color:var(--verde)}
.vivo{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--suave)}
.vivo:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--verde);box-shadow:0 0 10px var(--verde)}
.metricas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:14px;overflow:hidden;margin-bottom:20px}
.metrica{background:var(--bg2);padding:14px 16px}
.metrica b{display:block;font-weight:300;font-size:26px;letter-spacing:-.02em}
.metrica span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.metrica b.ambar{color:var(--ambar)} .metrica b.verde{color:var(--verde)}
.plano{position:relative;border:1px solid var(--linea);border-radius:18px;background:
  linear-gradient(var(--bg2),var(--bg2)) padding-box;overflow-x:auto}
.plano:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;
  background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:22px 22px}
svg{display:block;width:100%;min-width:760px;height:auto;position:relative}
.zona{fill:none;stroke:var(--linea2);stroke-width:1}
.zona-titulo{fill:var(--tenue);font-size:10px;letter-spacing:.22em;font-family:"JetBrains Mono",monospace}
.flujo{stroke:var(--linea2);stroke-width:1.2;fill:none}
.flujo.activo{stroke:var(--verde);stroke-dasharray:4 6;animation:fluir 1s linear infinite}
@keyframes fluir{to{stroke-dashoffset:-20}}
.nodo{cursor:pointer}
.nodo .base{fill:#0f141b;stroke:var(--linea2);stroke-width:1}
.nodo .anillo{fill:none;stroke-width:2}
.nodo .halo{fill:none;stroke-width:1;opacity:0}
.nodo.corriendo .halo{animation:pulso 1.8s ease-out infinite}
@keyframes pulso{0%{opacity:.7;r:30}100%{opacity:0;r:48}}
.nodo text{text-anchor:middle}
.nodo .ini{font-size:13px;font-weight:500;fill:var(--texto);font-family:"JetBrains Mono",monospace}
.nodo .nom{font-size:13px;font-weight:500;fill:var(--texto)}
.nodo .est{font-size:11px;fill:var(--suave);font-family:"JetBrains Mono",monospace}
.nodo:hover .base,.nodo.sel .base{stroke:var(--texto)}
.aviso{display:none;margin:0 0 16px;padding:10px 14px;border:1px solid #f5c45155;border-radius:10px;color:var(--ambar);background:#f5c4510d;font-size:14px}
.aviso.on{display:block}
.lista{margin-top:20px;border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.fila{display:grid;grid-template-columns:200px 130px 1fr 1fr;gap:16px;align-items:start;padding:14px 18px;border-top:1px solid var(--linea);background:var(--bg2);scroll-margin-top:16px}
.fila:first-child{border-top:0}
.fila.sel{background:#111821}
.fila .n{font-weight:500}
.fila .n small{display:block;font-weight:400;color:var(--suave);font-size:12px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:"JetBrains Mono",monospace;color:var(--suave)}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.corriendo{color:var(--verde)} .chip.esperando-ok{color:var(--ambar)} .chip.fallo{color:var(--rojo)}
.chip.ok{color:var(--azul)} .chip.sin-datos{color:var(--gris)}
.dato{font-size:13px;color:var(--suave)}
.dato b{display:block;font-weight:400;color:var(--texto);font-family:"JetBrains Mono",monospace;font-size:12.5px}
.dato a{color:var(--azul);text-decoration:none;border-bottom:1px solid #7cc4ff44}
.notas{grid-column:1/-1;margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.notas li{font-size:12.5px;color:#d8c48f;border:1px solid #f5c45133;border-radius:999px;padding:3px 10px}
footer{margin-top:22px;color:var(--tenue);font-size:12.5px}
@media (max-width:760px){
  .metricas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fila{grid-template-columns:1fr auto;gap:8px 12px}
  .fila .dato{grid-column:1/-1}
  h1{font-size:22px}
}
</style>
</head>
<body>
<main>
  <header>
    <div class="marca">
      <small>Sin Tokens · Operaciones</small>
      <h1>Oficina de <i>agentes</i></h1>
    </div>
    <div class="vivo mono" id="reloj">--:-- ART</div>
  </header>
  <section class="metricas">
    <div class="metrica"><b class="verde" id="m-trabajando">–</b><span>Trabajando ahora</span></div>
    <div class="metrica"><b class="ambar" id="m-ok">–</b><span>Esperan tu OK</span></div>
    <div class="metrica"><b id="m-proxima">–</b><span id="m-proxima-l">Próxima corrida</span></div>
    <div class="metrica"><b id="m-act">–</b><span>Actualizado</span></div>
  </section>
  <div class="aviso" id="aviso"></div>
  <section class="plano"><svg id="plano" viewBox="0 0 1000 470" role="img" aria-label="Plano de la oficina"></svg></section>
  <section class="lista" id="lista"></section>
  <footer>Datos reales de GitHub Actions y del repo. Si algo no está, se dice. Se actualiza cada hora y cuando arranca o termina un agente.</footer>
</main>
<script>
"use strict";
const RAW = "https://raw.githubusercontent.com/facutablet25-commits/sin-tokens-media/main/oficina/estado.json";
const NS = "http://www.w3.org/2000/svg";
// Posición de cada agente en el plano (coordenadas del viewBox 1000x470).
const POS = {
  research:{x:110,y:150}, copy:{x:250,y:150}, formatos:{x:390,y:150}, editor:{x:530,y:150},
  atencion:{x:700,y:150}, pauta:{x:820,y:150}, orquestador:{x:760,y:330},
  gemini:{x:110,y:360}, antigravity:{x:290,y:360}, publicador:{x:500,y:360},
};
const ZONAS = [
  {x:40, y:40, w:560, h:210, t:"VIERNES 00:00 · CONTENIDO"},
  {x:630,y:40, w:330, h:390, t:"DOMINGO 09:00 · NEGOCIO"},
  {x:40, y:270,w:560, h:160, t:"TODOS LOS DÍAS · OPERACIÓN"},
];
const FLUJOS = [["research","copy"],["copy","formatos"],["formatos","editor"],["atencion","pauta"],["pauta","orquestador"],["editor","publicador"]];
const COLOR = {"corriendo":"#3ddc84","esperando-ok":"#f5c451","fallo":"#ff5d6c","ok":"#7cc4ff","sin-datos":"#5b6574"};
const ESTADO = {"corriendo":"Trabajando","esperando-ok":"Espera tu OK","ok":"En pausa","fallo":"Falló","sin-datos":"Sin corridas"};
const TZ = "America/Argentina/Buenos_Aires";
const F_FECHA = new Intl.DateTimeFormat("es-AR",{timeZone:TZ,weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const F_HORA = new Intl.DateTimeFormat("es-AR",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
let datos = null, sel = null;

function fecha(iso){ return iso ? F_FECHA.format(new Date(iso)) : "—"; }
function rel(iso){
  if(!iso) return "";
  const m = Math.round((new Date(iso)-Date.now())/60000), a = Math.abs(m);
  if(a<1) return "recién";
  const t = a<60 ? `${a} min` : a<2880 ? `${Math.round(a/60)} h` : `${Math.round(a/1440)} d`;
  return m>=0 ? `en ${t}` : `hace ${t}`;
}
function corto(ag){
  if(ag.estado==="corriendo") return "trabajando";
  if(ag.estado==="fallo") return "falló";
  if(ag.estado==="esperando-ok"){ const n = ag.notas.find(x=>x.includes("OK")); const m = n && n.match(/^(\d+)/); return m ? `${m[1]} esperan OK` : "espera OK"; }
  if(ag.proxima) return rel(ag.proxima);
  return ag.id==="antigravity" ? "a pedido" : "sin corridas";
}
function s(tag, attrs, txt){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(txt!=null) e.textContent = txt; return e; }
function h(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt!=null) e.textContent = txt; return e; }

function plano(){
  const svg = document.getElementById("plano"); svg.replaceChildren();
  for(const z of ZONAS){
    svg.append(s("rect",{class:"zona",x:z.x,y:z.y,width:z.w,height:z.h,rx:14}));
    svg.append(s("text",{class:"zona-titulo",x:z.x+18,y:z.y+24},z.t));
  }
  const porId = {}; (datos?datos.agentes:[]).forEach(a=>porId[a.id]=a);
  for(const [a,b] of FLUJOS){
    const p1 = POS[a], p2 = POS[b]; const activo = porId[a] && porId[a].estado==="corriendo";
    const d = p1.y===p2.y ? `M${p1.x+30},${p1.y} L${p2.x-30},${p2.y}`
      : `M${p1.x},${p1.y+78} C${p1.x},${(p1.y+78+p2.y-34)/2} ${p2.x},${(p1.y+78+p2.y-34)/2} ${p2.x},${p2.y-34}`;
    svg.append(s("path",{class:"flujo"+(activo?" activo":""),d}));
  }
  for(const id in POS){
    const ag = porId[id]; const p = POS[id]; const est = ag ? ag.estado : "sin-datos"; const c = COLOR[est];
    const g = s("g",{class:`nodo ${est}${sel===id?" sel":""}`,transform:`translate(${p.x},${p.y})`,tabindex:0});
    g.append(s("circle",{class:"halo",r:30,stroke:c}));
    g.append(s("circle",{class:"base",r:28}));
    g.append(s("circle",{class:"anillo",r:28,stroke:c,"stroke-dasharray":est==="sin-datos"?"3 5":"none",opacity:est==="ok"?.55:1}));
    g.append(s("text",{class:"ini",y:5},(ag?ag.nombre:id).slice(0,2).toUpperCase()));
    g.append(s("text",{class:"nom",y:50},ag?ag.nombre:id));
    g.append(s("text",{class:"est",y:66,fill:c},ag?corto(ag):"sin datos"));
    g.addEventListener("click",()=>marcar(id));
    g.addEventListener("keydown",e=>{ if(e.key==="Enter") marcar(id); });
    svg.append(g);
  }
}
function lista(){
  const l = document.getElementById("lista"); l.replaceChildren();
  for(const ag of datos.agentes){
    const f = h("article","fila"+(sel===ag.id?" sel":"")); f.id = "ag-"+ag.id;
    const n = h("div","n",ag.nombre); n.append(h("small",null,`${ag.rol} · ${ag.motor}`));
    const u = ag.ultima;
    const d1 = h("div","dato","Última"); const b1 = h("b",null, u ? `${fecha(u.cuando)} · ${({success:"bien",failure:"falló",cancelled:"cancelada",timed_out:"se pasó de tiempo"})[u.resultado]||u.resultado}` : (ag.estado==="corriendo"?"en curso":"sin corridas todavía"));
    d1.append(b1);
    if(u && /^https:\/\//.test(u.url||"")){ const a = h("a",null,"ver corrida"); a.href = u.url; a.target = "_blank"; a.rel = "noopener"; d1.append(a); }
    const d2 = h("div","dato","Próxima"); d2.append(h("b",null, ag.proxima ? `${fecha(ag.proxima)} · ${rel(ag.proxima)}` : (ag.id==="antigravity"?"cuando lo abras en tu PC":"sin programar")));
    f.append(n, h("span","chip "+ag.estado, ESTADO[ag.estado]||ag.estado), d1, d2);
    if(ag.notas.length){ const ul = h("ul","notas"); ag.notas.forEach(x=>ul.append(h("li",null,x))); f.append(ul); }
    l.append(f);
  }
}
function metricas(){
  document.getElementById("m-trabajando").textContent = `${datos.trabajando}/${datos.agentes.length}`;
  const p = datos.pendientes_telegram; const tot = p.piezas+p.lotes+p.productos+p.otros;
  document.getElementById("m-ok").textContent = tot;
  const prox = datos.agentes.filter(a=>a.proxima && a.id!=="publicador").sort((a,b)=>a.proxima.localeCompare(b.proxima))[0];
  document.getElementById("m-proxima").textContent = prox ? rel(prox.proxima) : "—";
  document.getElementById("m-proxima-l").textContent = prox ? `Próxima · ${prox.nombre}` : "Próxima corrida";
  document.getElementById("m-act").textContent = rel(datos.actualizado);
  const viejo = Date.now()-new Date(datos.actualizado) > 90*60000;
  aviso(viejo ? `El estado no se actualiza desde ${fecha(datos.actualizado)}. Puede que publicar.yml no esté corriendo.` : "");
}
function aviso(t){ const a = document.getElementById("aviso"); a.textContent = t; a.classList.toggle("on",!!t); }
function marcar(id){ sel = id; plano(); lista(); const f = document.getElementById("ag-"+id); if(f) f.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function render(){ plano(); lista(); metricas(); }

async function cargar(){
  for(const url of ["estado.json", RAW]){
    try{
      const r = await fetch(url+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) continue;
      datos = await r.json(); render(); return;
    }catch(e){}
  }
  plano();
  aviso("No pude leer el estado de los agentes. No muestro nada inventado: probá recargar en un rato.");
}
setInterval(()=>{ document.getElementById("reloj").textContent = F_HORA.format(new Date())+" ART"; if(datos) metricas(); },1000);
setInterval(cargar,120000);
cargar();
</script>
</body>
</html>
